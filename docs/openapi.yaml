openapi: 3.0.3
info:
  title: weather_api
  description: |
    SBS weather_api HTTP 계약 (실구현 기준).

    - Producer 카탈로그: `skills/weather-api-catalog`
    - HGT500 상세 클라이언트 플로우: `docs/kim_hgt500_frontend_api_spec.md`
    - HGT500 packed PNG 변환/복호화: `skills/kim-hgt500-png-pipeline`
    - 태풍/admin API는 이 서버에 없음 (별도 typhoon API 참고)

    미구현(PRD only, 문서화하지 않음): `POST /api/hgt500/datasets`, `GET /api/hgt500/jobs/{jobId}`
  version: 1.0.0
  contact:
    name: weather_api

servers:
  - url: http://localhost:3010
    description: Local (listen 0.0.0.0:3010)
  - url: https://weather-map.sbs.co.kr
    description: Production

tags:
  - name: hgt500
    description: KIM TXT 기반 500hPa 지위고도 dataset pointer / 목록 / manifest
  - name: aws
    description: AWS_MIN station JSON (`in_data/aws`, main_AWS 산출)
  - name: ir105-json
    description: GK2A IR105 JSON (DB 또는 filesystem)
  - name: image
    description: 레거시 이미지/바람 파일 (`/{type}/{area}/{step}/image`)
  - name: static
    description: Static file prefixes

paths:
  /api/hgt500/latest:
    get:
      tags: [hgt500]
      summary: 최신 KIM HGT500 dataset pointer
      description: |
        최신 성공 dataset의 mutable pointer.
        animation은 이 응답만으로 만들지 말고 `manifestUrl`의 frames를 사용한다.
      operationId: getHgt500Latest
      responses:
        '200':
          description: 최신 dataset pointer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hgt500DatasetPointer'
              example:
                datasetId: kim-glob-hgt500-2026070100
                tmfc: '2026070100'
                status: succeeded
                sourceFormat: kim-api-text
                downsampleFactor: 3
                analysisTime: '2026-07-01T00:00:00Z'
                validTimeStart: '2026-07-01T00:00:00Z'
                validTimeEnd: '2026-07-04T00:00:00Z'
                sourceForecastIntervalMinutes: 180
                outputFrameIntervalMinutes: 10
                frameCount: 433
                manifestUrl: /datasets/kim-glob-hgt500-2026070100/manifest.json
        '404':
          description: 생성된 dataset 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No KIM HGT500 dataset is available
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetails'

  /api/hgt500/datasets:
    get:
      tags: [hgt500]
      summary: KIM HGT500 dataset 목록
      description: |
        디스크의 성공 dataset을 스캔한다. `Cache-Control: no-store`.
        정렬은 `tmfc` 내림차순. 항목 shape는 `/api/hgt500/latest`와 동일.
      operationId: listHgt500Datasets
      parameters:
        - name: tmfc
          in: query
          schema:
            type: string
            pattern: '^\d{10}$'
          description: YYYYMMDDHH UTC. 해당 분석시각만
          example: '2026072800'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: ISO-8601. valid window와 구간 겹침(inclusive)
          example: '2026-07-28T00:00:00Z'
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: ISO-8601. valid window와 구간 겹침(inclusive)
          example: '2026-08-02T00:00:00Z'
        - name: intervalMinutes
          in: query
          schema:
            type: integer
          description: outputFrameIntervalMinutes 정확 일치
        - name: downsampleFactor
          in: query
          schema:
            type: integer
          description: downsampleFactor 정확 일치
        - name: sourceFormat
          in: query
          schema:
            type: string
          description: 예 kim-api-text
        - name: status
          in: query
          schema:
            type: string
            default: succeeded
          description: 기본 succeeded. `all`이면 status 필터 없음
      responses:
        '200':
          description: 목록 (empty items 가능)
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hgt500DatasetList'
        '400':
          description: query 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetails'

  /api/hgt500/datasets/{datasetId}/manifest:
    get:
      tags: [hgt500]
      summary: manifest로 redirect
      description: |
        `302 Location: /datasets/{datasetId}/manifest.json`
        클라이언트는 보통 latest/list의 `manifestUrl`을 직접 fetch하는 편이 단순하다.
      operationId: redirectHgt500Manifest
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '302':
          description: static manifest URL로 redirect
          headers:
            Location:
              schema:
                type: string
                example: /datasets/kim-glob-hgt500-2026070100/manifest.json
        '400':
          description: datasetId 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid datasetId

  /datasets/{datasetId}/manifest.json:
    get:
      tags: [static, hgt500]
      summary: Dataset manifest (static)
      description: |
        `@fastify/static` prefix `/datasets/`.
        Frame asset 경로는 manifest 기준 상대 경로.
        상세 schema는 `docs/kim_hgt500_frontend_api_spec.md` 참고.
      operationId: getHgt500ManifestStatic
      parameters:
        - $ref: '#/components/parameters/DatasetId'
      responses:
        '200':
          description: Manifest JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hgt500Manifest'
        '404':
          description: 파일 없음

  /datasets/{datasetId}/{assetName}:
    get:
      tags: [static, hgt500]
      summary: Dataset asset (static)
      description: |
        dataPng / metadataJson / previewPng / anomalyPng 등.
        datasetId별 immutable 산출물로 취급해도 된다.
      operationId: getHgt500DatasetAsset
      parameters:
        - $ref: '#/components/parameters/DatasetId'
        - name: assetName
          in: path
          required: true
          schema:
            type: string
          example: g576_v091_glob_prs_hgt500_202607010000.png
      responses:
        '200':
          description: PNG 또는 JSON asset
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
        '404':
          description: 파일 없음

  /api/aws/stations:
    get:
      tags: [aws]
      summary: AWS 지점 코드표 (stn_inf)
      description: |
        `kma_fetch/config/aws_stn_code_YYYYMMDD.json` (최신 날짜 suffix)을 반환한다.
        `LAW_ADDR_SIDO` / `LAW_ADDR_GUGUN` 및 최신 `STN_NAME`·좌표 lookup용.
        프레임 JSON(`/api/aws/min`)에는 LAW 필드를 저장하지 않으며, min 응답은 서버가 enrich한다.
      operationId: getAwsStations
      responses:
        '200':
          description: station catalog
          headers:
            Cache-Control:
              schema:
                type: string
                example: 'public, max-age=3600'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsStationsResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetails'

  /api/aws/min/pack:
    get:
      tags: [aws]
      summary: AWS 1분 packed day timeline manifest
      description: |
        KST **하루** 1분 timeline의 변수별 Int16 LE pack manifest.
        권장 query: `date=YYYYMMDD` (또는 YYYY-MM-DD) → 서버가 `0000–2359`로 펼친다.
        레거시: `from`/`to` (YYYYMMDDHHMM)도 허용.
        `variable` 기본 `TA`. 지원: `TA, RN_15M, RN_60M, RN_12HR, RN_24HR, WS_INS, WS, WD_INS, WD, HM, TD`. `FULL` 없음.
        `RN_1HR`는 `RN_60M` 별칭이라 pack 불가. `RN_6HR`/`RN_48HR`/`RN_YN` 제외.
        단일 변수는 기존과 같이 해당 manifest. 복수는 `{ variables, items: [manifest...] }` (binary는 섞지 않음).
        Binary는 변수별 파일 (`data.url`, 예: `/datasets/aws/ta/1m/{day}/ta.i16le`, `/datasets/aws/ws_ins/1m/{day}/ws_ins.i16le`).
        layout: FRAME_MAJOR_STATION_MINOR, scale 0.1, missing -32768.
        TA 결측: null, sentinel -999, Hub 물리 ≤ -50℃(×10 ≤ -500), > 60℃ → -32768. 정상 음수 유지.
        강수 결측: null/비유한, Hub ≤ -50mm, 음수, Int16 overflow → -32768. **0.0 mm는 binary 0**. TA temporal QC 없음.
        풍속 0은 유효. 풍향 0–360도(무풍 360) 유지. 습도 0–100%. 이슬점은 TA QC/60℃ clip 없음.
        Binary URL: 과거 complete는 immutable+ETag, 오늘/미완은 no-store.
        schemaVersion 3. TA temporal QC( pack 전용 ): 1분 |ΔTA|>3℃ 또는 고립 스파이크 → -32768. manifest `qc.taTemporal`. /exact는 원천 유지.
        과거 완결일(`complete:true`)은 1,440개 timestamp 파일 존재. 값 coverage는 `coverage.status` (`ok|degraded|empty`)와 `dataComplete`.
        `complete:true`여도 전부 결측이면 `coverage.status=empty` + warnings. 구 pack(sourceField/coverage 없음)은 캐시하지 않고 재빌드.
        오늘(미완)은 요청 시 재빌드, `no-store`.
        `AWS_FETCH_SOURCE=auto`는 DB row가 있어도 RN_12HR/TD가 전부 없으면 같은 TM Hub를 1회 merge한다.
        일 pack은 backfill 종료 후·어제 워밍으로 미리 생성한다.
        임의 구간·전 변수 JSON은 `/api/aws/min/range` (2분).
      operationId: getAwsMinPack
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: '^(\d{8}|\d{4}-\d{2}-\d{2})$'
          example: '20260812'
          description: KST 일자. 지정 시 0000–2359 하루 pack (권장)
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{12}$'
          example: '202608120000'
          description: 레거시. date 없을 때 to와 함께 사용
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{12}$'
          example: '202608122359'
          description: 레거시. date 없을 때 from과 함께 사용
        - name: variable
          in: query
          required: false
          schema:
            type: string
            default: TA
            example: TA,RN_60M,WS_INS
          description: |
            기본 TA. 지원 `TA,RN_15M,RN_60M,RN_12HR,RN_24HR,WS_INS,WS,WD_INS,WD,HM,TD`.
            comma 복수 시 변수별 manifest 배열. `FULL`·`RN_1HR`·미지원은 400.
        - name: force
          in: query
          required: false
          schema:
            type: string
            enum: ['0', '1', 'true', 'false']
          description: cache 무시하고 재생성
      responses:
        '200':
          description: pack manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsMinPackManifest'
        '400':
          description: date/범위/variable 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 요청 범위에 원자료 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetails'

  /api/aws/min/exact:
    get:
      tags: [aws]
      summary: AWS_MIN 1분 exact 단건 (debug/parity)
      description: |
        2분 snap 없이 `timestamp_kor` 파일만 읽는다. pack parity 확인용.
      operationId: getAwsMinExact
      parameters:
        - name: timestamp_kor
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{12}$'
          example: '202608121533'
      responses:
        '200':
          description: station 배열 (enrich 포함)
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp_kor:
                    type: string
                  intervalMinutes:
                    type: integer
                    example: 1
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AwsStationRow'
        '400':
          description: 형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 파일 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/aws/min:
    get:
      tags: [aws]
      summary: AWS_MIN station JSON 단건
      description: |
        `in_data/aws/{yyyy-MM-dd}/AWS_MIN_{YYYYMMDDHHMM}.json`을 읽는다.
        기본: `timestamp_kor` 2분 nearest snap (호환).
        `intervalMinutes=1`이면 snap 없이 exact ( `/api/aws/min/exact` 와 동일).
        응답 `data[]`는 코드표 enrich.
      operationId: getAwsMin
      parameters:
        - name: timestamp_kor
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{12}$'
          description: YYYYMMDDHHMM KST
          example: '202604050000'
        - name: intervalMinutes
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2]
          description: 생략 또는 2 = 2분 snap, 1 = exact
      responses:
        '200':
          description: station 배열
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsMinResponse'
        '400':
          description: timestamp_kor 누락/형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 해당 시각 파일 없음
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  timestamp_kor:
                    type: string
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetails'

  /api/aws/min/range:
    get:
      tags: [aws]
      summary: AWS_MIN station JSON 시간 범위
      description: |
        `from`~`to` (inclusive)를 2분 간격으로 열거해 존재하는 파일만 `items`에 담는다.
        없는 시각은 `missingTimestamps`에 모은다.
        최대 frame 수 360 (약 12시간). `from`/`to`도 2분 nearest snap.
        각 `items[].data`는 기본으로 코드표 enrich (`STN_NAME`, `LAW_ADDR_*`).
        `enrich=0`이면 디스크 JSON 그대로 (클라이언트는 `/api/aws/stations` lookup).
        서버는 파일을 병렬 읽고 parsed LRU를 쓴다. 12시간(360 frame) JSON은 여전히 큼.
        일단위 1분 기온 재생·일최고/임계는 `/api/aws/min/pack` (변수별 binary).
        이 endpoint는 임의 `from`/`to`·전 변수 JSON용으로 유지한다.
      operationId: getAwsMinRange
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{12}$'
          description: YYYYMMDDHHMM KST (inclusive start)
          example: '202604050000'
        - name: to
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{12}$'
          description: YYYYMMDDHHMM KST (inclusive end)
          example: '202604050100'
        - name: enrich
          in: query
          required: false
          schema:
            type: string
            enum: ['0', '1', 'true', 'false']
          description: 기본 1. 0이면 LAW/이름 enrich 생략
      responses:
        '200':
          description: 범위 결과
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwsMinRangeResponse'
        '400':
          description: from/to 누락, 순서 오류, 범위 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetails'

  /ir105/{area}/{step}:
    get:
      tags: [ir105-json]
      summary: IR105 JSON 단건 (PostgreSQL)
      operationId: getIr105Json
      parameters:
        - $ref: '#/components/parameters/Ir105Area'
        - $ref: '#/components/parameters/Ir105Step'
        - name: timestamp_kor
          in: query
          required: true
          schema:
            type: string
          description: DB `observation_time_kor`와 일치하는 값
          example: '2025-03-01T00:00:00Z'
      responses:
        '200':
          description: ir105_json row
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: timestamp_kor 누락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 데이터 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWithDetails'

  /ir105/{area}/{step}/batch:
    get:
      tags: [ir105-json]
      summary: IR105 JSON 배치 (PostgreSQL)
      operationId: getIr105JsonBatch
      parameters:
        - $ref: '#/components/parameters/Ir105Area'
        - $ref: '#/components/parameters/Ir105Step'
        - name: timestamps
          in: query
          required: true
          schema:
            type: string
          description: comma-separated observation_time_kor 목록
          example: '2025-03-01T00:00:00Z,2025-03-01T00:10:00Z'
      responses:
        '200':
          description: 행 배열 JSON
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    observation_time_kor:
                      type: string
                    data:
                      description: JSON payload
                  additionalProperties: true
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ir105/{area}/{step}/fs:
    get:
      tags: [ir105-json]
      summary: IR105 JSON gzip 파일 (filesystem)
      description: |
        로컬 gzip JSON 파일을 그대로 반환 (`Content-Encoding: gzip`).
        query는 `timestamp_utc` (YYYYMMDDHHMM UTC).
      operationId: getIr105JsonFs
      parameters:
        - $ref: '#/components/parameters/Ir105Area'
        - $ref: '#/components/parameters/Ir105Step'
        - name: timestamp_utc
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{12}$'
          description: YYYYMMDDHHMM UTC
          example: '202604050000'
      responses:
        '200':
          description: gzip-compressed JSON body
          headers:
            Content-Encoding:
              schema:
                type: string
                example: gzip
          content:
            application/json:
              schema:
                type: string
                format: binary
        '400':
          description: timestamp_utc 누락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 파일 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /{type}/{area}/{step}/image:
    get:
      tags: [image]
      summary: 레거시 이미지 또는 GFS wind JSON
      description: |
        `timestamp_kor` (YYYYMMDDHHMM KST) 필수.
        서버는 product family별로 nearest timestamp로 내림/스냅한다.

        - GFS wind (`gfs-wind_*`): `application/json`
        - 그 외 대부분: `image/png`

        새 KIM global TXT HGT500은 이 라우트가 아니라 `/api/hgt500/*` + `/datasets/*`를 사용한다.
        `/kim-hgt500/.../image`는 레거시 NC 기반 이미지용이다.
      operationId: getLegacyImage
      parameters:
        - name: type
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ImageType'
          description: product type
        - name: area
          in: path
          required: true
          schema:
            type: string
          description: |
            영역 코드. 예: `fd`(full disk), `easia` 등.
            `fd`이면 projection `ge`, 그 외 `lc` (IR105 파일명).
          example: fd
        - name: step
          in: path
          required: true
          schema:
            type: string
          description: 해상도/스텝 식별자 (예 1)
          example: '1'
        - name: timestamp_kor
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{12}$'
          description: YYYYMMDDHHMM KST
          example: '202604050000'
      responses:
        '200':
          description: PNG 이미지 또는 GFS wind JSON
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                description: GFS wind u/v grid JSON
                additionalProperties: true
        '400':
          description: timestamp_kor 누락 또는 unsupported KIM kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 파일 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /weather/{path}:
    get:
      tags: [static]
      summary: 원천 weather 파일 트리 (static)
      description: |
        `@fastify/static` prefix `/weather/` → MODE에 따른 ROOT_DIR.
        하위 경로로 gk2a/rdr/aws/gfs/kim 원본 파일에 직접 접근 가능.
      operationId: getWeatherStatic
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: ROOT_DIR 기준 상대 경로
      responses:
        '200':
          description: 파일
        '404':
          description: 파일 없음

components:
  parameters:
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
        pattern: '^kim-glob-hgt500-\d{10}$'
      example: kim-glob-hgt500-2026070100
    Ir105Area:
      name: area
      in: path
      required: true
      schema:
        type: string
      example: ea
    Ir105Step:
      name: step
      in: path
      required: true
      schema:
        type: string
      example: '10'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    ErrorWithDetails:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required: [error]

    Hgt500DatasetPointer:
      type: object
      properties:
        datasetId:
          type: string
          example: kim-glob-hgt500-2026070100
        tmfc:
          type: string
          description: YYYYMMDDHH UTC
        status:
          type: string
          example: succeeded
        sourceFormat:
          type: string
          example: kim-api-text
        downsampleFactor:
          type: integer
        analysisTime:
          type: string
          format: date-time
        validTimeStart:
          type: string
          format: date-time
        validTimeEnd:
          type: string
          format: date-time
        sourceForecastIntervalMinutes:
          type: integer
        outputFrameIntervalMinutes:
          type: integer
        frameCount:
          type: integer
        manifestUrl:
          type: string
          description: 상대 또는 절대 path. 보통 `/datasets/{id}/manifest.json`

    Hgt500DatasetList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Hgt500DatasetPointer'
      required: [items]

    Hgt500Manifest:
      type: object
      description: 요약 schema. 상세는 kim_hgt500_frontend_api_spec.md
      properties:
        schemaVersion:
          type: integer
          example: 1
        datasetId:
          type: string
        variable:
          type: string
          example: hgt
        unit:
          type: string
          example: m
        domain:
          type: string
          example: glob
        frames:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              forecastHour:
                type: number
              validTime:
                type: string
                format: date-time
              dataPng:
                type: string
              metadataJson:
                type: string
              previewPng:
                type: string
              anomalyPng:
                type: string
      additionalProperties: true

    AwsStationRow:
      type: object
      description: |
        AWS_MIN row. 디스크 파일은 DB join 형태이며 LAW 필드 없음.
        `/api/aws/min`·`/range` 응답에서는 코드표로 STN_NAME 최신화 및 LAW_ADDR_* 부착.
      properties:
        STN_NAME:
          type: string
          nullable: true
          description: stn_inf STN_KO (HTTP enrich / 저장 시 패치)
        STN_ID:
          type: integer
        TM:
          type: string
          description: YYYYMMDDHHMM
        LAT:
          type: number
        LON:
          type: number
        HT:
          type: number
          nullable: true
        LAW_ADDR_SIDO:
          type: string
          nullable: true
          description: HTTP enrich 전용. 디스크 JSON에는 없음
        LAW_ADDR_GUGUN:
          type: string
          nullable: true
          description: 시·군·구(없으면 읍·면·동). HTTP enrich 전용
        WD:
          type: number
          nullable: true
        WS:
          type: number
          nullable: true
        TA:
          type: number
          nullable: true
        HM:
          type: number
          nullable: true
        PA:
          type: number
          nullable: true
        PS:
          type: number
          nullable: true
        RN_YN:
          type: number
          nullable: true
        RN_1HR:
          type: number
          nullable: true
        RN_15M:
          type: number
          nullable: true
        RN_60M:
          type: number
          nullable: true
        RN_24HR:
          type: number
          nullable: true
        WD_INS:
          type: number
          nullable: true
        WS_INS:
          type: number
          nullable: true
      additionalProperties: true

    AwsMinFrame:
      type: object
      properties:
        timestamp_kor:
          type: string
        count:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/AwsStationRow'
      required: [timestamp_kor, count, data]

    AwsStationsResponse:
      type: object
      properties:
        source:
          type: string
          nullable: true
        generatedAt:
          type: string
          format: date-time
          nullable: true
        schemaVersion:
          type: integer
          nullable: true
        codeFile:
          type: string
          example: aws_stn_code_20260811.json
        stationCount:
          type: integer
        stations:
          type: array
          items:
            type: object
            properties:
              STN_ID:
                type: integer
              STN_NAME:
                type: string
                nullable: true
              LAT:
                type: number
              LON:
                type: number
              HT:
                type: number
                nullable: true
              LAW_ADDR_SIDO:
                type: string
                nullable: true
              LAW_ADDR_GUGUN:
                type: string
                nullable: true
      required: [stationCount, stations, codeFile]

    AwsMinPackManifest:
      type: object
      description: 1분 변수별 pack manifest (binary는 data.url)
      properties:
        schemaVersion:
          type: integer
          example: 3
        datasetId:
          type: string
          example: aws-ta-1m-20260812-v3a1b2c3d
        source:
          type: string
          example: KMA_AWS_MIN
        variable:
          type: string
          enum: [TA, RN_15M, RN_60M, RN_12HR, RN_24HR, WS_INS, WS, WD_INS, WD, HM, TD]
          example: TA
        sourceField:
          type: string
          example: RN-60m
        unit:
          type: string
          example: degC
        accumulation:
          type: object
          additionalProperties: true
        timezone:
          type: string
          example: Asia/Seoul
        intervalMinutes:
          type: integer
          example: 1
        from:
          type: string
        to:
          type: string
        frameCount:
          type: integer
        stationCount:
          type: integer
        complete:
          type: boolean
          description: 과거 하루 1,440개 timestamp JSON 존재 여부 (값 coverage와 별개)
        dataComplete:
          type: boolean
          description: coverage.status === ok
        validSampleCount:
          type: integer
        missingSampleCount:
          type: integer
        validRatio:
          type: number
        coverage:
          type: object
          properties:
            status:
              type: string
              enum: [ok, degraded, empty]
            validSampleCount:
              type: integer
            missingSampleCount:
              type: integer
            validRatio:
              type: number
            jsonPresentCount:
              type: integer
        generatedAt:
          type: string
          format: date-time
        stationOrder:
          type: string
          example: STN_ID_ASC
        stations:
          type: array
          items:
            type: object
            additionalProperties: true
        data:
          type: object
          properties:
            url:
              type: string
              example: /datasets/aws/ta/1m/20260812/ta.i16le
            dtype:
              type: string
              example: int16
            endianness:
              type: string
              example: little
            order:
              type: string
              example: FRAME_MAJOR_STATION_MINOR
            scale:
              type: number
              example: 0.1
            offset:
              type: number
              example: 0
            missingValue:
              type: integer
              example: -32768
            byteLength:
              type: integer
            sha256:
              type: string
        missingTimestamps:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
      required:
        - schemaVersion
        - datasetId
        - variable
        - intervalMinutes
        - from
        - to
        - frameCount
        - stationCount
        - stations
        - data
        - complete
        - dataComplete
        - sourceField
        - validSampleCount
        - missingSampleCount
        - coverage
        - warnings
        - missingTimestamps

    AwsMinResponse:
      allOf:
        - $ref: '#/components/schemas/AwsMinFrame'
        - type: object
          properties:
            requested_timestamp_kor:
              type: string
              description: snap 전 요청 값

    AwsMinRangeResponse:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        requested_from:
          type: string
        requested_to:
          type: string
        intervalMinutes:
          type: integer
          example: 2
        requestedCount:
          type: integer
        itemCount:
          type: integer
        missingTimestamps:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/AwsMinFrame'
      required: [from, to, intervalMinutes, items, missingTimestamps]

    ImageType:
      type: string
      description: 지원 type (server.js 주석 기준)
      enum:
        - ir105-mono
        - ir105-color
        - rdr-hsp
        - rdr-hsp-equi
        - aws-RN_15M
        - aws-RN_60M
        - gfs-wind_10m
        - gfs-wind_850mb
        - gfs-wind_500mb
        - gfs-0p25_tmp_10m
        - gfs-0p25_tmp_500mb
        - gfs-0p25_tmp_850mb
        - gfs-0p25_rh_10m
        - gfs-0p25_rh_500mb
        - gfs-0p25_rh_850mb
        - gfs_equ-0p25_tmp_10m
        - gfs_equ-0p25_tmp_500m
        - gfs_equ-0p25_tmp_850m
        - kim-psl
        - kim-hgt500
